name: Build and Release

on:
  workflow_call:
    inputs:
      release-version:
        required: true
        type: string
      draft-flag:
        type: string
        default: " "
    secrets:
      XCFRAMEWORK_SIGNING_TOKEN:
        required: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Validate release version
        run: |
          version="${{ inputs.release-version }}"
          major="${version%%.*}"
          if [[ ! "$major" =~ ^[0-9]+$ ]] || (( major < 6 || major > 8 )); then
            echo "::error::Capacitor $version is not supported by this repository. Starting with Capacitor 9 (see https://github.com/ionic-team/capacitor/pull/8588 PR), the iOS platform is a source-first Swift package built directly from the ionic-team/capacitor repository, so SPM distribution no longer happens here. This repository only releases major versions 6, 7, and 8."
            exit 1
          fi
      - run: |
          if [[ "${{ inputs.release-version }}" =~ ^[67]\. ]]; then
            sudo xcode-select --switch /Applications/Xcode_16.2.app
          else
            sudo xcode-select --switch /Applications/Xcode_26.0.app
          fi
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: brew install ghr
      - name: Check Simulators
        run: xcrun simctl list > /dev/null
      - name: Install Simulators
        run: xcodebuild -downloadPlatform iOS
      - name: Build Capacitor and Cordova
        run: ./build-cap ${{ inputs.release-version }}
      - name: Sign Capacitor xcframework
        uses: ionic-team/sign-xcframework@main
        with:
          cert-token: ${{ secrets.XCFRAMEWORK_SIGNING_TOKEN }}
          xcframework-path: Capacitor.xcframework
      - name: Sign Cordova xcframework
        uses: ionic-team/sign-xcframework@main
        with:
          cert-token: ${{ secrets.XCFRAMEWORK_SIGNING_TOKEN }}
          xcframework-path: Cordova.xcframework
      - name: Package Capacitor and Cordova
        run: ./package-cap ${{ inputs.release-version }}
      - name: Push manifest update
        uses: EndBug/add-and-commit@v9
      - name: Create Release
        run: ghr -token ${{ secrets.GITHUB_TOKEN }} -name ${{ inputs.release-version }} ${{ inputs.draft-flag }} -replace ${{ inputs.release-version }} frameworks
